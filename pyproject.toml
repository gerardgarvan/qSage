[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

# Package metadata lives in setup.cfg so that both old setuptools (Ubuntu 22.04's 59.x,
# which its system pip ends up using) and current setuptools read it. A [project] table
# here is ignored by setuptools < 61 and produces an empty "UNKNOWN-0.0.0" package.

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["qSage", ".git", ".benchmarks", "__pycache__"]

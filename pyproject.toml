[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qseries-sage"
version = "1.3.0"
description = "Python/SageMath port of Garvan's Maple qseries package v1.3"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["qseries*"]

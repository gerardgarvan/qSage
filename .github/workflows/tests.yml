name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: setup.cfg

      - name: Install SageMath (passagemath wheels) and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: passagemath-standard pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Check the package installs and imports (PKG-01)
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP"
          python -c "import qseries; from qseries import *; print(packageversion(), len(qseries.__all__), 'names')"

      - name: Build the tutorial (fails if any example raises)
        run: python docs/make_tutorial.py

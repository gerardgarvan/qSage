[metadata]
name = qseries-sage
version = attr: qseries.__version__
description = Python/SageMath port of Garvan's Maple qseries package v1.3
long_description = file: README.md
long_description_content_type = text/markdown
license = GPL-2.0-or-later
license_files = LICENSE
author = Gerard Garvan
url = https://github.com/gerardgarvan/qSage
project_urls =
    Source = https://github.com/gerardgarvan/qSage
    Tutorial = https://github.com/gerardgarvan/qSage/blob/main/docs/tutorial.md
    Maple parity report = https://github.com/gerardgarvan/qSage/blob/main/parity/parity_report.md
    Garvan's qseries package = https://qseries.org/fgarvan/qmaple/qseries/
keywords = q-series, partitions, theta functions, eta products, modular forms, SageMath, Maple
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Intended Audience :: Education
    Operating System :: POSIX :: Linux
    Operating System :: MacOS
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering :: Mathematics

[options]
packages = find:
python_requires = >=3.10

[options.extras_require]
passagemath = passagemath-standard

[options.packages.find]
include = qseries, qseries.*

[metadata]
name = qseries-sage
version = attr: qseries.__version__
description = Python/SageMath port of Garvan's Maple qseries package v1.3
long_description = file: README.md
long_description_content_type = text/markdown
license = GPL-2.0-or-later

[options]
packages = find:
python_requires = >=3.10

[options.packages.find]
include = qseries, qseries.*
